name: Build desktop apps
on:
  push:
    branches: [main, master]
    tags: ['v*', 'windows-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test core and browser script
        run: zsh macOS/test.sh
      - name: Install offline account portal test dependency
        run: npm install --no-save --prefix Windows/tests jquery@3.7.1
      - name: Test native WKWebView first submission
        run: zsh macOS/test-frames.sh
      - name: Test native portal error notices
        run: zsh macOS/test-notices.sh
      - name: Build universal app
        run: zsh macOS/source/build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent macOS/CampusConnect.app CampusConnect-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-macOS-universal
          path: CampusConnect-macOS-universal.zip
  windows:
    name: windows (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test core and native layouts
        run: |
          dotnet run --project Windows/tests -c Release -- Windows/work/generated-login-script.js Windows/work/captcha-probe.js Windows/work/captcha-image.js
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          dotnet run --project Windows/tests -c Release -- --frame-fixture Windows/work/frame-scripts.json
      - name: Test native CAPTCHA input and configuration persistence
        run: dotnet run --project Windows/native-tests -c Release
      - name: Test browser automation
        run: node Windows/tests/portal.test.mjs
      - name: Test desktop pages
        shell: pwsh
        run: |
          npm install --no-save --prefix Windows/tests playwright@1.58.2 jquery@3.7.1
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed.' }
          npx --prefix Windows/tests playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }
          foreach ($test in @('frames', 'desktop', 'wired', 'mode-profiles', 'agreements', 'recovery', 'eportal', 'portal-early', 'performance', 'flicker', 'operator-collapse', 'service-guide', 'redirect', 'captcha', 'sso-captcha', 'zportal', 'haust', 'haust-account')) {
            node "Windows/tests/$test.test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "$test tests failed." }
          }
      - name: Install NSIS
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'NSIS download failed after three attempts.' }
            Start-Sleep -Seconds 10
          }
      - name: Test installer file manifest
        run: python Windows/installer/test-manifest.py
      - name: Build setup installer
        shell: pwsh
        run: ./Windows/build-installer.ps1 -Runtime ${{ matrix.runtime }}
      - name: Test single-file startup, shortcuts, repair, upgrade and uninstall
        shell: pwsh
        run: ./Windows/installer/smoke-test.ps1 -Installer ./Windows/installer/dist/CampusConnect-Windows-${{ matrix.arch }}-Setup.exe
      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics-${{ matrix.runtime }}
          path: Windows/installer/work/smoke-diagnostics/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-Setup-${{ matrix.runtime }}
          path: Windows/installer/dist/*-Setup.exe
